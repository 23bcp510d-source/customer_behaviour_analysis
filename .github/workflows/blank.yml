
name: Customer Behaviour Analysis CI

on:
  push:
    branches: [main, "CBA-14-add-automated-tests"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-and-test:
    name: Validate Project and Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: python -m pip install --upgrade pip

      - name: Check Required Project Files
        run: |
          test -f customer_shopping_behavior.csv
          test -f customer_behaviour_query.sql
          test -f README.md
          test -f tests/test_project.py
          echo "All required project files are present."

      - name: Validate CSV Structure
        run: |
          python - <<'PY'
          import csv

          path = "customer_shopping_behavior.csv"

          with open(path, newline="", encoding="utf-8-sig") as file:
              sample = file.read(8192)
              file.seek(0)

              try:
                  dialect = csv.Sniffer().sniff(sample, delimiters=",\t;|")
              except csv.Error:
                  dialect = csv.excel_tab

              reader = csv.reader(file, dialect)
              header = next(reader, None)

              assert header, "CSV header is missing"
              assert len(header) > 1, "Expected multiple columns"

              rows = sum(1 for row in reader if row)
              assert rows > 0, "CSV contains no data rows"

              print(f"CSV validation passed: {rows} data rows")
              print(f"Columns detected: {len(header)}")
          PY

      - name: Run Automated Python Tests
        run: python -m unittest discover -s tests -v

      - name: Verify SQL File
        run: test -s customer_behaviour_query.sql

      - name: Verify Documentation
        run: test -s README.md

      - name: CI Pipeline Successful
        run: echo "All project validations and tests passed."
